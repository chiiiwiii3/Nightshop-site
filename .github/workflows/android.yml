name: Build Android app
on:
  workflow_dispatch: {}
  push:
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Make a signing key for this build
        working-directory: android/app
        run: |
          keytool -genkeypair -keystore release.jks -alias nightshop -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Night Shop"
        env: { KS_PASS: nightshop-build-key }
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
        env: { KS_PASS: nightshop-build-key }
      - uses: actions/upload-artifact@v4
        with:
          name: NightShop-android-apk
          path: android/app/build/outputs/apk/release/*.apk
