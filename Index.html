<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b19">
<title>The Night Shop</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:radial-gradient(circle at top,#20204b,#080b19 65%);
 color:#f4f3ff;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{padding:35px 15px 15px}
.crest{font-size:38px;color:#a98cff}
h1{font-size:32px;letter-spacing:5px;margin:10px 0;color:#d8c8ff}
.subtitle{color:#aaa4c8;letter-spacing:3px;font-size:11px}
#login-door{
 width:min(90%,390px);
 margin:45px auto;
 padding:30px 22px;
 background:linear-gradient(145deg,#171a35,#101225);
 border:1px solid #6551a5;
 border-radius:14px;
 box-shadow:0 0 35px #7655c455;
}
#login-door h2{letter-spacing:3px;color:#c9b5ff}
input,button{
 width:100%;
 padding:14px;
 margin:9px 0;
 border-radius:7px;
 font-size:15px;
}
input{
 background:#090c1c;
 border:1px solid #49416b;
 color:white;
}
button{
 border:0;
 background:linear-gradient(90deg,#6244b5,#9270e8);
 color:white;
 font-weight:bold;
 letter-spacing:2px;
 cursor:pointer;
}
button:disabled{opacity:.5}
#status-note,#strike-note{font-size:13px;color:#c6b5ff}
#shop-app{
 display:none;
 width:min(100%,1100px);
 margin:auto;
 padding:20px;
}
.shop-panel{
 background:#15172c;
 border:1px solid #55458a;
 border-radius:12px;
 padding:20px;
 margin:15px 0;
}
.shop-panel h2{color:#cbb8ff;letter-spacing:2px}
footer{padding:35px 10px;color:#77728f;font-size:11px;letter-spacing:2px}
</style>
</head>

<body>

<header>
 <div class="crest">♛</div>
 <h1>THE NIGHT SHOP</h1>
 <p class="subtitle">PRIVATE ACCESS • MEMBERS ONLY</p>
</header>

<main>
 <section id="login-door">
  <h2>THE ENTRANCE</h2>
  <p>Enter your member credentials.</p>

  <form id="login-form">
   <input
    type="text"
    name="username"
    placeholder="Username"
    autocomplete="username"
    required
   >

   <input
    type="password"
    name="password"
    placeholder="Password"
    autocomplete="current-password"
    required
   >

   <button type="submit" id="login-button">UNLOCK THE DOOR</button>
  </form>

  <p id="strike-note">Strikes: 0 / 3</p>
  <p id="status-note">Awaiting credentials...</p>
 </section>

 <section id="shop-app">
  <div class="shop-panel">
   <h2>WELCOME INSIDE</h2>
   <p>Your private shop experience begins here.</p>
  </div>
 </section>
</main>

<footer>THE NIGHT SHOP • PRIVATE ESTABLISHMENT</footer>

<script type="module" src="./login.js"></script>
</body>
</html>
