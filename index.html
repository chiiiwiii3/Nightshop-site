<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b19">
<title>The Night Shop</title>
<style>
:root{color-scheme:dark;--bg:#080b19;--panel:#15172c;--line:#55458a;--glow:#9270e8;--text:#f4f3ff;--muted:#aaa4c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#292454,var(--bg) 58%);color:var(--text);font-family:Arial,sans-serif}
header{text-align:center;padding:32px 16px 12px}.crest{font-size:38px;color:#b9a0ff}h1{font-size:clamp(25px,6vw,38px);letter-spacing:5px;margin:8px 0;color:#e0d4ff}.subtitle{color:var(--muted);letter-spacing:3px;font-size:11px}
main{width:min(100% - 28px,1050px);margin:20px auto 50px}
#login-door{width:min(100%,410px);margin:35px auto;padding:28px 22px;background:linear-gradient(145deg,#191b38,#101225);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 35px #7655c455;text-align:center}
h2{color:#d2c1ff;letter-spacing:2px}input,textarea,select{width:100%;padding:13px;margin:8px 0;border-radius:7px;border:1px solid #49416b;background:#090c1c;color:white;font:inherit}button{padding:13px 18px;border:0;border-radius:7px;background:linear-gradient(90deg,#6244b5,#9270e8);color:white;font-weight:bold;letter-spacing:1px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.wide{width:100%}
#status-note,#strike-note{font-size:13px;color:#c6b5ff;min-height:18px}
#shop-app{display:none}.shop-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin:15px 0}.shop-panel h2{margin-top:0}.muted{color:var(--muted)}.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.product-card{background:#101225;border:1px solid #403568;border-radius:10px;padding:16px;text-align:left}.product-card h3{color:#d5c6ff}.product-card button{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}
footer{text-align:center;padding:28px 10px;color:#77728f;font-size:11px;letter-spacing:2px}

/* NIGHT SHOP — neon street-front + private lounge restoration */
:root{--blue:#43cfff;--violet:#9a68ff;--red:#ff365f;--gold:#d7bd82;--panel:#111522}
body{background:#05070d;color:#f5f2eb;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(3,5,12,.18),rgba(3,5,12,.88)),radial-gradient(ellipse at 50% 18%,#25334a 0,#0a101d 45%,#03050a 100%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background:repeating-linear-gradient(105deg,transparent 0 80px,rgba(255,255,255,.035) 81px,transparent 83px),linear-gradient(180deg,transparent 70%,rgba(0,0,0,.7))}
header{padding:34px 12px 8px;text-shadow:0 0 18px #38bfff88}
.crest{font-size:42px;color:#d7bd82;text-shadow:0 0 10px #d7bd82,0 0 30px #39bfff}
h1{font-family:Georgia,serif;font-weight:normal;letter-spacing:7px;color:#f4e9d2;text-shadow:0 0 9px #3acaff,0 0 26px #3acaff88}
.subtitle{color:#9edcf0;letter-spacing:4px}
main{position:relative;max-width:1180px;margin:12px auto 48px}
#login-door{position:relative;isolation:isolate;overflow:hidden;width:min(100%,520px);margin:34px auto 55px;padding:34px 28px 28px;background:linear-gradient(145deg,rgba(13,20,34,.97),rgba(5,8,15,.98));border:1px solid #318db3;border-radius:3px;box-shadow:0 0 0 5px #101522,0 0 0 7px #4acfff55,0 0 35px #258bc988,inset 0 0 35px #1d8fbd22;text-align:center}
#login-door:before{content:"";position:absolute;z-index:-1;inset:10px;border:1px solid #d2b87855;background:linear-gradient(90deg,transparent 48%,#46cfff12 50%,transparent 52%),linear-gradient(180deg,#17253a88,#080b13ee);box-shadow:inset 0 0 35px #41bff522}
#login-door:after{content:"NIGHT SHOP  •  PRIVATE MEMBERS CLUB";display:block;margin:24px -10px 0;padding:13px 4px;border-top:1px solid #d2b87866;border-bottom:1px solid #d2b87866;color:#d7bd82;font:10px Arial,sans-serif;letter-spacing:3px}
#login-door h2{font-family:Georgia,serif;font-weight:normal;letter-spacing:5px;color:#b8eaff;text-shadow:0 0 14px #38bfff}
#login-door .muted{color:#b5b9c7}
input,textarea,select{border-radius:2px;border:1px solid #3a6a7d;background:#070d17;color:#fff}
button{border-radius:2px;background:linear-gradient(100deg,#123f60,#167ca3 55%,#6245a0);border:1px solid #56cafa;color:#f5fbff;box-shadow:0 0 14px #31bfff44;text-transform:uppercase}
button:hover{filter:brightness(1.2);box-shadow:0 0 20px #31bfff88}
#status-note,#strike-note{color:#9edcf0}
#shop-app{position:relative;padding:14px 0 34px}
#shop-app:before{content:"THE PRIVATE LOUNGE";display:block;text-align:center;color:#d7bd82;letter-spacing:5px;font:12px Arial,sans-serif;padding:16px 8px 22px;text-shadow:0 0 12px #d7bd8255}
.shop-panel{position:relative;background:linear-gradient(145deg,rgba(26,29,39,.97),rgba(8,11,18,.98));border:1px solid #806b4c;border-radius:3px;padding:22px;margin:16px 0;box-shadow:0 12px 32px #0009,inset 0 1px #ffffff0c}
.shop-panel h2{font-family:Georgia,serif;font-weight:normal;letter-spacing:4px;color:#e7d3a7;text-shadow:0 0 12px #c59a5a44}
.shop-panel:first-child{border-color:#3c9ab9;box-shadow:0 0 22px #1b8db533,inset 0 0 22px #1b8db511}
.muted{color:#a8a8b5}
.product-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.product-card{position:relative;overflow:hidden;background:linear-gradient(150deg,#202534,#0b101a 75%);border:1px solid #4b7180;border-radius:3px;padding:20px;text-align:left;box-shadow:inset 0 0 24px #45caff0b,0 8px 20px #0008}
.product-card:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#4acfff,#a17aff,transparent);box-shadow:0 0 12px #4acfff}
.product-card h3{font-family:Georgia,serif;font-size:21px;font-weight:normal;color:#e6d5b4}
.product-card p{color:#b6b9c4;line-height:1.55}
.product-card button{width:100%;margin-top:10px}
.row{align-items:center}
#shop-state{letter-spacing:2px;font:11px Arial,sans-serif}
#order-panel{border-color:#4aaac5}
footer{color:#777f91}
@media(min-width:760px){#login-door{margin-top:52px;padding:42px 38px}#shop-app{padding:20px 12px 50px}.shop-panel{padding:28px 30px}}

</style>
</head>
<body>
<header>
 <div class="crest">♛</div>
 <h1>THE NIGHT SHOP</h1>
 <p class="subtitle">PRIVATE ACCESS · MEMBERS ONLY</p>
</header>
<main>
 <section id="login-door">
  <h2>THE ENTRANCE</h2><p class="muted">Enter your member credentials.</p>
  <form id="login-form">
   <input name="username" type="text" placeholder="Username" autocomplete="username" required>
   <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
   <button class="wide" type="submit" id="login-button">UNLOCK THE DOOR</button>
  </form>
  <p id="strike-note">Strikes: 0 / 3</p><p id="status-note">Awaiting credentials...</p>
 </section>
 <section id="shop-app">
  <div class="shop-panel"><div class="row"><div><h2 id="member-greeting">WELCOME INSIDE</h2><p class="muted" id="shop-state">Checking shop status…</p></div><button id="sign-out-button" type="button">SIGN OUT</button></div></div>
  <section class="shop-panel"><h2>THE COLLECTION</h2><div id="product-list" class="product-grid"></div></section>
  <section class="shop-panel"><h2>YOUR ORDERS</h2><div id="order-history" class="muted">No orders loaded.</div></section>
  <section class="shop-panel"><h2>PRIVATE MESSAGE</h2><form id="message-form"><textarea name="message" rows="3" maxlength="1000" placeholder="Leave a private message…" required></textarea><button type="submit">SEND MESSAGE</button></form><div id="message-status" class="muted"></div><div id="message-history"></div></section>
  <section class="shop-panel hidden" id="owner-tools"><h2>OWNER CONTROLS</h2><button id="toggle-shop-button" type="button">TOGGLE SHOP STATUS</button><div id="owner-orders"></div></section>
 </section>
</main>
<footer>THE NIGHT SHOP · PRIVATE ESTABLISHMENT</footer>
<script type="module" src="./login.js?v=nightshop-20261103-8"></script>
</body>
</html>
