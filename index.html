<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b19">
<title>The Night Shop</title>
<style>
:root{color-scheme:dark;--bg:#080b19;--panel:#15172c;--line:#55458a;--glow:#9270e8;--text:#f4f3ff;--muted:#aaa4c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#292454,var(--bg) 58%);color:var(--text);font-family:Arial,sans-serif}
header{text-align:center;padding:32px 16px 12px}.crest{font-size:38px;color:#b9a0ff}h1{font-size:clamp(25px,6vw,38px);letter-spacing:5px;margin:8px 0;color:#e0d4ff}.subtitle{color:var(--muted);letter-spacing:3px;font-size:11px}
main{width:min(100% - 28px,1050px);margin:20px auto 50px}
#login-door{width:min(100%,410px);margin:35px auto;padding:28px 22px;background:linear-gradient(145deg,#191b38,#101225);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 35px #7655c455;text-align:center}
h2{color:#d2c1ff;letter-spacing:2px}input,textarea,select{width:100%;padding:13px;margin:8px 0;border-radius:7px;border:1px solid #49416b;background:#090c1c;color:white;font:inherit}button{padding:13px 18px;border:0;border-radius:7px;background:linear-gradient(90deg,#6244b5,#9270e8);color:white;font-weight:bold;letter-spacing:1px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.wide{width:100%}
#status-note,#strike-note{font-size:13px;color:#c6b5ff;min-height:18px}
#shop-app{display:none}.shop-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin:15px 0}.shop-panel h2{margin-top:0}.muted{color:var(--muted)}.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.product-card{background:#101225;border:1px solid #403568;border-radius:10px;padding:16px;text-align:left}.product-card h3{color:#d5c6ff}.product-card button{width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none!important}
footer{text-align:center;padding:28px 10px;color:#77728f;font-size:11px;letter-spacing:2px}

/* NIGHT SHOP — neon street-front + private lounge restoration */
:root{--blue:#43cfff;--violet:#9a68ff;--red:#ff365f;--gold:#d7bd82;--panel:#111522}
body{background:#05070d;color:#f5f2eb;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(3,5,12,.18),rgba(3,5,12,.88)),radial-gradient(ellipse at 50% 18%,#25334a 0,#0a101d 45%,#03050a 100%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background:repeating-linear-gradient(105deg,transparent 0 80px,rgba(255,255,255,.035) 81px,transparent 83px),linear-gradient(180deg,transparent 70%,rgba(0,0,0,.7))}
header{padding:34px 12px 8px;text-shadow:0 0 18px #38bfff88}
.crest{font-size:42px;color:#d7bd82;text-shadow:0 0 10px #d7bd82,0 0 30px #39bfff}
h1{font-family:Georgia,serif;font-weight:normal;letter-spacing:7px;color:#f4e9d2;text-shadow:0 0 9px #3acaff,0 0 26px #3acaff88}
.subtitle{color:#9edcf0;letter-spacing:4px}
main{position:relative;max-width:1180px;margin:12px auto 48px}
#login-door{display:none;position:relative;isolation:isolate;overflow:hidden;width:min(100%,520px);margin:34px auto 55px;padding:34px 28px 28px;background:linear-gradient(145deg,rgba(13,20,34,.97),rgba(5,8,15,.98));border:1px solid #318db3;border-radius:3px;box-shadow:0 0 0 5px #101522,0 0 0 7px #4acfff55,0 0 35px #258bc988,inset 0 0 35px #1d8fbd22;text-align:center}
#login-door:before{content:"";position:absolute;z-index:-1;inset:10px;border:1px solid #d2b87855;background:linear-gradient(90deg,transparent 48%,#46cfff12 50%,transparent 52%),linear-gradient(180deg,#17253a88,#080b13ee);box-shadow:inset 0 0 35px #41bff522}
#login-door:after{content:"NIGHT SHOP  •  PRIVATE MEMBERS CLUB";display:block;margin:24px -10px 0;padding:13px 4px;border-top:1px solid #d2b87866;border-bottom:1px solid #d2b87866;color:#d7bd82;font:10px Arial,sans-serif;letter-spacing:3px}
#login-door h2{font-family:Georgia,serif;font-weight:normal;letter-spacing:5px;color:#b8eaff;text-shadow:0 0 14px #38bfff}
#login-door .muted{color:#b5b9c7}
input,textarea,select{border-radius:2px;border:1px solid #3a6a7d;background:#070d17;color:#fff}
button{border-radius:2px;background:linear-gradient(100deg,#123f60,#167ca3 55%,#6245a0);border:1px solid #56cafa;color:#f5fbff;box-shadow:0 0 14px #31bfff44;text-transform:uppercase}
button:hover{filter:brightness(1.2);box-shadow:0 0 20px #31bfff88}
#status-note,#strike-note{color:#9edcf0}
#shop-app{position:relative;padding:14px 0 34px}
#shop-app:before{content:"THE PRIVATE LOUNGE";display:block;text-align:center;color:#d7bd82;letter-spacing:5px;font:12px Arial,sans-serif;padding:16px 8px 22px;text-shadow:0 0 12px #d7bd8255}
.shop-panel{position:relative;background:linear-gradient(145deg,rgba(26,29,39,.97),rgba(8,11,18,.98));border:1px solid #806b4c;border-radius:3px;padding:22px;margin:16px 0;box-shadow:0 12px 32px #0009,inset 0 1px #ffffff0c}
.shop-panel h2{font-family:Georgia,serif;font-weight:normal;letter-spacing:4px;color:#e7d3a7;text-shadow:0 0 12px #c59a5a44}
.shop-panel:first-child{border-color:#3c9ab9;box-shadow:0 0 22px #1b8db533,inset 0 0 22px #1b8db511}
.muted{color:#a8a8b5}
.product-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.product-card{position:relative;overflow:hidden;background:linear-gradient(150deg,#202534,#0b101a 75%);border:1px solid #4b7180;border-radius:3px;padding:20px;text-align:left;box-shadow:inset 0 0 24px #45caff0b,0 8px 20px #0008}
.product-card:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#4acfff,#a17aff,transparent);box-shadow:0 0 12px #4acfff}
.product-card h3{font-family:Georgia,serif;font-size:21px;font-weight:normal;color:#e6d5b4}
.product-card p{color:#b6b9c4;line-height:1.55}
.product-card button{width:100%;margin-top:10px}
.row{align-items:center}
#shop-state{letter-spacing:2px;font:11px Arial,sans-serif}
#order-panel{border-color:#4aaac5}
footer{color:#777f91}
@media(min-width:760px){#login-door{margin-top:52px;padding:42px 38px}#shop-app{padding:20px 12px 50px}.shop-panel{padding:28px 30px}}



/* THE EXTERIOR — the approved storefront picture, scaled to fit any screen.
   The picture and the two clickable doors live in one 16:9 box, so the doors always stay on top of the artwork. */
#street-scene{position:relative;width:100%;max-width:1180px;margin:8px auto 34px;overflow:hidden;background:#05070d;border:1px solid #28384a;box-shadow:0 22px 55px #000c}
.exterior-frame{position:relative;width:100%;aspect-ratio:1672 / 941}
#exterior-artwork{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hotspot{position:absolute;z-index:3;padding:0;margin:0;border:0;border-radius:6px;background:transparent;box-shadow:none;text-transform:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hotspot:hover{filter:none;box-shadow:none;background:rgba(255,226,170,.07)}
.hotspot:focus-visible{outline:2px solid #43cfff;outline-offset:2px}
.door-hotspot{left:32%;top:28%;width:25%;height:51%}
.bath-hotspot{left:81%;top:32%;width:11%;height:48%}
.door-hotspot.door-opening{background:rgba(255,226,170,.2);transition:background .45s}
.tap-hint{position:absolute;z-index:2;left:0;right:0;bottom:2.2%;margin:0;text-align:center;font:clamp(8px,1.5vw,11px) Arial,sans-serif;letter-spacing:3px;color:#ffd9a0;text-shadow:0 0 10px #000,0 0 16px #ff365f88;pointer-events:none}
.window-message{position:absolute;z-index:8;right:2%;bottom:4%;width:min(320px,94%);padding:14px 16px;background:#0a1321f2;border:1px solid #4bcfff;box-shadow:0 0 28px #35bfff66;color:#e8f7ff;text-align:left;backdrop-filter:blur(12px)}
.window-message b{color:#9be5ff;letter-spacing:2px;font:11px Arial}
.window-message textarea{margin:8px 0;font-size:14px}
.window-message form button{width:100%}
.window-message #close-window{float:right;padding:3px 9px}
#question-status{font:12px Arial;min-height:16px;margin:6px 0 0}
@media(max-width:560px){.window-message{position:static;width:100%;box-shadow:none}}

/* INTERIOR LOUNGE */
#lounge-scene{position:relative;min-height:390px;height:clamp(390px,53vw,540px);overflow:hidden;margin:0 0 20px;border:1px solid #826b4c;background:linear-gradient(180deg,#0c111d,#151a26 54%,#090d14);box-shadow:0 20px 45px #000b}
.lounge-ceiling{position:absolute;inset:0 0 50%;background:radial-gradient(ellipse at 50% 110%,#73519a55,transparent 65%),linear-gradient(#090d17,#202331)}
.lounge-ceiling:after{content:"";position:absolute;left:8%;right:8%;top:18%;height:2px;background:#d7bd82;box-shadow:0 0 15px #d7bd82}
.lounge-title{position:absolute;z-index:5;top:7%;left:0;right:0;text-align:center;color:#e6d5b4;font:clamp(13px,2.2vw,20px) Georgia,serif;letter-spacing:5px;text-shadow:0 0 12px #b98c55}
.lounge-bar{position:absolute;right:4%;top:26%;width:23%;height:39%;background:linear-gradient(90deg,#1a202a,#5b4638,#171c26);border:2px solid #9b805d;box-shadow:0 0 20px #a7794933}
.lounge-bar:before{content:"THE BAR";position:absolute;top:12%;left:0;right:0;text-align:center;color:#d7bd82;font:10px Arial;letter-spacing:3px}
.lounge-bar:after{content:"";position:absolute;left:10%;right:10%;bottom:16%;height:42%;background:repeating-linear-gradient(90deg,#0b1720 0 17%,#4d8290 18%,#0b1720 20%);border-bottom:3px solid #d7bd82}
.lounge-sofa{position:absolute;left:7%;bottom:13%;width:43%;height:24%;border-radius:22px 22px 6px 6px;background:linear-gradient(#8d705d 0 16%,#483b38 18% 78%,#1c1b20 80%);box-shadow:inset 0 8px #b4977c,0 15px 18px #000}
.lounge-sofa:before,.lounge-sofa:after{content:"";position:absolute;top:16%;bottom:12%;width:17%;background:linear-gradient(90deg,#261f20,#8b6e5a);border-radius:10px}
.lounge-sofa:before{left:0}.lounge-sofa:after{right:0}
.lounge-pool{position:absolute;left:38%;bottom:8%;width:29%;height:19%;background:linear-gradient(#27715c 0 10%,#0d382f 12% 78%,#4e3425 80%);border:7px solid #553b2d;box-shadow:0 10px 16px #000}
.lounge-pool:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #8fc8a066}
.lounge-pool:after{content:"";position:absolute;left:24%;top:35%;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:35px -10px #f4d24b,66px 10px #e65353,100px -3px #d6dbe5}
.lounge-floor{position:absolute;bottom:0;left:0;right:0;height:18%;background:repeating-linear-gradient(90deg,#161b25 0 70px,#202632 71px 73px);border-top:2px solid #8e7657}
.lounge-hologram{position:absolute;z-index:4;top:29%;left:8%;width:26%;padding:12px 8px;text-align:center;color:#a8edff;background:#47caff12;border:1px solid #49cfff88;box-shadow:0 0 20px #38caff33,inset 0 0 20px #38caff22;transform:perspective(250px) rotateY(8deg)}
.lounge-hologram b{display:block;font-size:clamp(17px,3vw,27px);text-shadow:0 0 12px #4acfff}.lounge-hologram span{font:8px Arial;letter-spacing:2px}
.lounge-hologram.h2{left:auto;right:31%;top:35%;width:17%;color:#d4b2ff;border-color:#b58aff88}
.lounge-hologram.h3{left:auto;right:4%;top:8%;width:20%;color:#e4d09a;border-color:#d7bd8288}
.lounge-controls{position:absolute;z-index:7;left:12px;bottom:12px;display:flex;gap:8px}
.lounge-controls button{padding:8px 11px;font:9px Arial;letter-spacing:1px}
#lounge-scene.lights-low{filter:brightness(.68) saturate(.8)}
@media(max-width:560px){.lounge-bar{right:3%;width:26%}.lounge-sofa{width:48%}.lounge-pool{left:37%;width:34%}.lounge-hologram{left:3%;width:30%}.lounge-hologram.h2{right:30%;width:18%}.lounge-hologram.h3{right:2%;width:23%}}
#lounge-scene{perspective:900px}
.lounge-ceiling{transform:perspective(700px) rotateX(-8deg);transform-origin:top}
.lounge-bar{transform:perspective(450px) rotateY(-7deg);box-shadow:-12px 10px 24px #0008,0 0 22px #a7794933}
.lounge-sofa{transform:perspective(500px) rotateY(7deg);box-shadow:inset 0 8px #b4977c,0 15px 18px #000,12px 8px 0 #211d1d}
.lounge-pool{transform:perspective(400px) rotateX(8deg);box-shadow:0 10px 16px #000,0 0 0 2px #a37c56}
.lounge-floor{background:repeating-linear-gradient(90deg,#161b25 0 70px,#202632 71px 73px),repeating-linear-gradient(0deg,transparent 0 40px,#d7bd8210 41px)}
.lounge-hologram{animation:holo-float 4s ease-in-out infinite}
.lounge-hologram.h2{animation-delay:-1.3s}.lounge-hologram.h3{animation-delay:-2.5s}
@keyframes holo-float{0%,100%{translate:0 0}50%{translate:0 -8px}}
#lounge-scene.alternate-view .lounge-title{letter-spacing:8px;text-shadow:0 0 20px #4acfff}
#lounge-scene.alternate-view .lounge-hologram{transform:perspective(250px) rotateY(-10deg) scale(1.06)}

</style>
</head>
<body>
<header>
 <div class="crest">♛</div>
 <h1>THE NIGHT SHOP</h1>
 <p class="subtitle">PRIVATE ACCESS · MEMBERS ONLY</p>
</header>
<main>
 
<section id="street-scene" aria-label="The Night Shop exterior">
 <div class="exterior-frame">
  <img id="exterior-artwork" src="./exterior.jpg" width="1672" height="941" alt="The Night Shop at night: a neon crown sign over black double doors with a red carpet, and a restroom door on the right">
  <button type="button" id="street-door" class="hotspot door-hotspot" aria-label="Enter The Night Shop"></button>
  <button type="button" id="bathroom-door" class="hotspot bath-hotspot" aria-label="Open the private question door"></button>
  <p class="tap-hint">TAP THE DOORS TO ENTER</p>
  <div class="window-message" id="window-message" hidden>
   <button type="button" id="close-window" aria-label="Close question panel">×</button>
   <b>PRIVATE QUESTION</b>
   <form id="question-form">
    <textarea name="message" rows="3" maxlength="1000" placeholder="Ask the owner a private question…" required></textarea>
    <button type="submit">SEND</button>
   </form>
   <p id="question-status" class="muted" aria-live="polite"></p>
  </div>
 </div>
</section>
<section id="login-door">
  <h2>THE ENTRANCE</h2><p class="muted">Enter your member credentials.</p>
  <form id="login-form">
   <input name="username" type="text" placeholder="Username" autocomplete="username" required>
   <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
   <button class="wide" type="submit" id="login-button">UNLOCK THE DOOR</button>
  </form>
  <p id="strike-note">Strikes: 0 / 3</p><p id="status-note">Awaiting credentials...</p>
 </section>
 <section id="shop-app"></section>
</main>
<footer>THE NIGHT SHOP · PRIVATE ESTABLISHMENT</footer>
<script>
/* Entrance + private question door interactions */
const streetScene = document.querySelector("#street-scene");
const loginDoor = document.querySelector("#login-door");
document.querySelector("#street-door")?.addEventListener("click", () => {
  const door = document.querySelector("#street-door");
  door?.classList.add("door-opening");
  if (loginDoor) {
    loginDoor.style.display = "block";
    loginDoor.scrollIntoView({behavior:"smooth",block:"center"});
    window.setTimeout(() => loginDoor.querySelector('input[name="username"]')?.focus({preventScroll:true}), 350);
  }
});
const windowMessage = document.querySelector("#window-message");
document.querySelector("#bathroom-door")?.addEventListener("click", () => {
  if (windowMessage) windowMessage.hidden = false;
});
document.querySelector("#close-window")?.addEventListener("click", () => {
  if (windowMessage) windowMessage.hidden = true;
});
</script>
<script type="module" src="./login.js?v=nightshop-exterior-upload-3"></script>
</body>
</html>
